<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search art · Masterpiece</title>
  <link rel="stylesheet" href="styles.css">
  <script type="speculationrules">{"prerender": [{"where": {"href_matches": "/*"}, "eagerness": "moderate"}]}</script>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="M5 16.5l4.5-5 3.5 3.5 2.5-2.5 3.5 4"/><circle cx="15.5" cy="9" r="1.6"/></svg></span><span>Masterpiece</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="/" class="tab on" aria-current="page" data-tab="search">Search art</a>
      <a href="collection.html" class="tab" data-tab="collection">My collection<span class="tab-count" id="collCount"></span></a>
      <a href="curator.html" class="tab" data-tab="curator">Curator</a>
      <a href="settings.html" class="tab" data-tab="settings">Settings</a>
    </nav>
    <button type="button" class="ver" id="verBtn" title="Check for updates"></button>
  </header>
  <div class="layout" id="layout">
    <aside class="panel" id="panel" aria-label="Filters">
      <div class="panel-head">
        <span>Filters</span>
        <button type="button" class="icon-btn ghost" id="panelToggle" title="Hide filters" aria-controls="panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      </div>

      <form id="search" class="search" autocomplete="off" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="Monet, sea, winter…" aria-label="Search art">
      </form>

      <details class="fgroup" id="museumsGroup">
        <summary>Museums <span class="val" id="sourcesSummary"></span></summary>
        <div class="mini-actions">
          <button type="button" class="link" id="srcAll">All</button>
          <button type="button" class="link" id="srcNone">None</button>
        </div>
        <div id="sources" class="checklist" role="group" aria-label="Museums"></div>
      </details>

      <details class="fgroup" open>
        <summary>Region <span class="val" id="regionSummary">Everywhere</span></summary>
        <div class="map-wrap">
          <svg id="worldMap" viewBox="0 0 1000 420" role="img" aria-label="World map of regions"></svg>
          <div class="map-tip" id="mapTip" hidden></div>
        </div>
        <div class="chips" id="regionList" role="group" aria-label="Regions"></div>
      </details>

      <details class="fgroup" open>
        <summary>Art</summary>
        <label class="field">Subject <select id="subject"><option value="">Anything</option></select></label>
        <label class="field">Period <select id="period"><option value="">Any time</option></select></label>
        <label class="field" title="Only some museums support colour search">Colour
          <select id="color">
            <option value="">Any</option><option value="red">Red</option><option value="orange">Orange</option>
            <option value="yellow">Yellow</option><option value="green">Green</option>
            <option value="blue">Blue</option><option value="purple">Purple</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="topOnly"> Highlights only</label>
      </details>

      <details class="fgroup" open>
        <summary>Fit</summary>
        <label class="field">Shape
          <select id="orientation">
            <option value="screens">Fits my screens</option>
            <option value="span" id="optSpan">Spans all my screens</option>
            <option value="any">Any shape</option>
            <option value="landscape">Landscape</option>
            <option value="portrait">Portrait</option>
            <option value="widescreen">≈ 16:9 widescreen</option>
            <option value="panorama">Panorama (2:1 and wider)</option>
          </select>
        </label>
        <label class="field" title="Width of the downloadable image">Resolution
          <select id="minWidth">
            <option value="sharp" id="optSharp">Sharp on my screens</option>
            <option value="0">Any size</option>
            <option value="1280">≥ 1280 px · HD</option>
            <option value="1920">≥ 1920 px · Full HD</option>
            <option value="2560">≥ 2560 px · QHD</option>
            <option value="3840">≥ 3840 px · 4K</option>
          </select>
        </label>
        <p class="screens" id="screenInfo"></p>
      </details>

      <details class="fgroup">
        <summary>Hide <span class="val" id="hideSummary"></span></summary>
        <div class="checklist" id="hide" role="group" aria-label="Hide"></div>
      </details>
    </aside>

    <button type="button" class="panel-open" id="panelOpen" title="Show filters">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Filters</span></button>

    <main class="content">
      <div id="notice" class="notice" hidden></div>
      <p id="regionNote" class="region-note" hidden></p>
      <div id="grid" class="grid"></div>
      <div class="more">
        <p id="status"></p>
        <button id="loadMore" hidden>Load more</button>
      </div>
    </main>
  </div>

  <div class="selbar" id="selbar" hidden>
    <b id="selCount">0 selected</b>
    <button type="button" class="link" id="showSel">show</button>
    <button type="button" class="link" id="clearSel">clear</button>
    <button type="button" class="primary small" id="addSel">Add to collection</button>
  </div>

  <dialog id="lightbox">
    <button class="icon-btn close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="icon-btn nav prev" id="lbPrev" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <figure>
      <div class="stage">
        <img id="lbImg" alt="">
        <div class="progress" id="lbBar" aria-hidden="true"><span id="lbProgress"></span></div>
      </div>
      <figcaption>
        <h2 id="lbTitle"></h2>
        <p id="lbMeta"></p>
        <p class="actions">
          <button id="lbSelect" class="primary"></button>
          <a id="lbLink" target="_blank" rel="noopener">View on museum site ↗</a>
        </p>
      </figcaption>
    </figure>
    <button class="icon-btn nav next" id="lbNext" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
