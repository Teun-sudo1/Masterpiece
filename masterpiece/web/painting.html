<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About this painting · Masterpiece</title>
  <script>try{let t=localStorage.getItem("theme")||"dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 0 0 40px; }
    
    .info { max-width: 1080px; margin: 28px auto 0; padding: 0 24px;
      display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
    @media (max-width: 820px) { .info { grid-template-columns: 1fr; } }
    .info .pic { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; }
    .info .pic img { display: block; width: 100%; height: auto; }
    .info h2 { margin: 0 0 6px; font: italic 700 30px/1.2 var(--sans); }
    .info .who { color: var(--muted); font-size: 16px; margin: 0 0 14px; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .pills span { padding: 3px 10px; border-radius: 999px; font-size: 12px; background: var(--panel-2);
      border: 1px solid var(--line); }
    .pills .now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
    a.button { display: inline-block; border-radius: var(--radius); padding: 9px 16px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--text); text-decoration: none; }
    a.button:hover { border-color: var(--muted); }
    .actions .fav.on { color: #ff6b81; border-color: #ff6b81; }
    .desc { white-space: pre-line; line-height: 1.6; margin: 0 0 18px; }
    .muted { color: var(--muted); font-size: 13px; }
    .curator { margin: -6px 0 14px; color: var(--accent); font-size: 14px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 16px; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    .loading { color: var(--muted); }
  </style>
  <script type="speculationrules">{"prerender": [{"where": {"href_matches": "/*"}, "eagerness": "moderate"}]}</script>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="3" fill="#15130f"/><rect x="2" y="2" width="20" height="20" rx="1.5" fill="#d4a24c"/><rect x="3" y="3" width="18" height="18" fill="#283a4a"/><rect x="3" y="12.5" width="18" height="8.5" fill="#3c4836"/><circle cx="14.9" cy="8.6" r="2.2" fill="#f3d792"/><path d="M3 15.8L8.6 9.6 13.9 15.8z" fill="#1c2421"/><path d="M9.6 15.8L15.8 11.5 21 15.8z" fill="#2e362c"/></svg></span><span>Masterpiece</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="/" class="tab" data-tab="search">Search art</a>
      <a href="collection.html" class="tab on" aria-current="page" data-tab="collection">My collection<span class="tab-count" id="collCount"></span></a>
      <a href="curator.html" class="tab" data-tab="curator">Curator</a>
      <a href="settings.html" class="tab" data-tab="settings">Settings</a>
    </nav>
    <button type="button" class="ver" id="verBtn" title="Check for updates"></button>
  </header>
  <main class="info" id="info">
    <p class="loading">Loading…</p>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="rotbar" id="rotBar">
    <div class="rot-left">
      <span class="seg rot-mode" id="rotMode" role="radiogroup" aria-label="What to show">
        <button type="button" role="radio" data-mode="curator" title="New paintings every day that suit your taste, plus your collection">Curator chooses</button>
        <button type="button" role="radio" data-mode="rotate" title="Only the paintings you added yourself">My collection</button>
      </span>
      <div class="now-status" id="rotStatus"></div>
    </div>
    <div class="now-controls">
      <button type="button" class="icon-btn" id="rotPrev" title="Previous painting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="icon-btn" id="rotPause" title="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      <button type="button" class="icon-btn" id="rotNext" title="Next painting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button type="button" class="primary small" id="rotStart" hidden>Start</button>
      <button type="button" class="restore small" id="rotRestore" hidden title="Stop Masterpiece and put back the wallpaper you had before">Restore my wallpaper</button>
    </div>
  </footer>
  <script src="shell.js"></script>
  <script>
    "use strict";
    mountShell("collection");
    const name = new URLSearchParams(location.search).get("name") || "";

    async function act(body, done) {
      try {
        const r = await api("/api/collection", body);
        done(r);
      } catch (e) { toast(`Didn't work: ${e.message}`); }
    }

    function render(p) {
      document.title = `${p.title} · Masterpiece`;
      const d = p.details || {};
      const facts = [["Date", p.year], ["Museum", p.museum], ...(d.facts || []),
                     ["Image", p.width ? `${p.width} × ${p.height} px` : ""], ["Licence", p.license]]
        .filter(([, v]) => v);
      $("info").replaceChildren(
        el("div", { class: "pic" },
          el("img", { src: `/api/thumb?name=${encodeURIComponent(p.name)}&size=large`, alt: p.title })),
        el("div", {},
          el("h2", {}, p.title),
          el("p", { class: "who" }, [p.maker, p.year].filter(Boolean).join(", ")),
          ...(p.curator ? [el("p", { class: "curator" }, el("b", {}, "Chosen by the Curator: "), p.curator)] : []),
          el("div", { class: "pills" },
            ...p.screens.map((s) => el("span", { class: "now" }, `On screen now · ${s}`)),
            ...(p.favourite ? [el("span", {}, "♥ Favourite")] : [])),
          el("div", { class: "actions" },
            el("button", { type: "button", class: "primary",
              onclick: () => act({ action: "show", name: p.name }, () => load()) },
              "Show now"),
            el("button", { type: "button", class: `fav${p.favourite ? " on" : ""}`,
              onclick: () => act({ action: "favourite", name: p.name, on: !p.favourite }, () => load()) }, p.favourite ? "♥ Favourite" : "♡ Favourite"),
            el("button", { type: "button", title: "Remove it from your collection and show another painting there",
              onclick: () => act({ action: "skip", name: p.name }, () => location.replace("collection.html")) }, "Skip"),
            ...(p.link ? [el("a", { class: "button", href: p.link, target: "_blank", rel: "noopener" }, "Museum page ↗")] : [])),
          ...(d.description ? [el("p", { class: "desc" }, d.description)]
            : [el("p", { class: "muted" }, p.detailsError
                || (p.link ? "The museum's own page has more about this painting." : ""))]),
          el("dl", {}, ...facts.flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, String(v))])),
          ...(d.credit ? [el("p", { class: "muted" }, d.credit)] : [])));
    }

    async function load() {
      try {
        render(await api(`/api/painting?name=${encodeURIComponent(name)}`));
      } catch (e) {
        $("info").replaceChildren(el("p", { class: "loading" }, e.message, " ",
          el("a", { href: "collection.html" }, "Back to My collection")));
      }
    }
    load();
  </script>
</body>
</html>
