[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masterpiece"
version = "0.7.1"
description = "Public-domain paintings as your Windows wallpaper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1", "pystray>=0.19", "pywebview>=5.3", "truststore>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
masterpiece = "masterpiece.__main__:main"

[tool.setuptools.packages.find]
include = ["masterpiece*"]

[tool.setuptools.package-data]
masterpiece = ["web/*", "data/*"]

[tool.pytest.ini_options]
markers = ["live: hits the real museum APIs (deselect with -m 'not live')"]
